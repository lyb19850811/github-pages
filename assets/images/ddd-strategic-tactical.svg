<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
  <rect width="800" height="480" fill="#f8fafc" rx="8"/>
  <text x="20" y="32" font-size="17" font-weight="bold" fill="#0f172a">DDD 全景：战略设计划定边界，战术设计实现模型</text>

  <text x="40" y="64" font-size="13" font-weight="bold" fill="#7c3aed">战略设计 Strategic Design —— 划分边界与协作（What / Where）</text>

  <rect x="40" y="78" width="232" height="72" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="56" y="102" font-size="14" font-weight="bold" fill="#0f172a">Ubiquitous Language</text>
  <text x="56" y="122" font-size="11" fill="#0f172a">通用语言：团队与代码共享一套领域词汇</text>
  <text x="56" y="138" font-size="11" fill="#6d28d9">语言的变化 = 模型的变化</text>

  <rect x="284" y="78" width="232" height="72" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="300" y="102" font-size="14" font-weight="bold" fill="#0f172a">Bounded Context</text>
  <text x="300" y="122" font-size="11" fill="#0f172a">限界上下文：模型在其中被定义且适用的边界</text>
  <text x="300" y="138" font-size="11" fill="#6d28d9">一个上下文内模型必须统一</text>

  <rect x="528" y="78" width="232" height="72" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="544" y="102" font-size="14" font-weight="bold" fill="#0f172a">Context Map</text>
  <text x="544" y="122" font-size="11" fill="#0f172a">上下文映射：显式描述上下文之间的关系</text>
  <text x="544" y="138" font-size="11" fill="#6d28d9">9 种关系模式（ACL / 发布语言…）</text>

  <text x="40" y="196" font-size="13" font-weight="bold" fill="#4f46e5">战术设计 Tactical Design —— 模型构建块（How）</text>

  <rect x="40" y="210" width="232" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="56" y="232" font-size="13" font-weight="bold" fill="#0f172a">Entity 实体</text>
  <text x="56" y="248" font-size="11" fill="#0f172a">以身份（identity）区分，跨生命周期</text>

  <rect x="284" y="210" width="232" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="300" y="232" font-size="13" font-weight="bold" fill="#0f172a">Value Object 值对象</text>
  <text x="300" y="248" font-size="11" fill="#0f172a">无身份，不可变，描述特征</text>

  <rect x="528" y="210" width="232" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="544" y="232" font-size="13" font-weight="bold" fill="#0f172a">Aggregate 聚合</text>
  <text x="544" y="248" font-size="11" fill="#0f172a">一致性边界，根强制不变量</text>

  <rect x="40" y="270" width="232" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="56" y="292" font-size="13" font-weight="bold" fill="#0f172a">Repository 仓储</text>
  <text x="56" y="308" font-size="11" fill="#0f172a">聚合的查询访问，假装内存集合</text>

  <rect x="284" y="270" width="232" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="300" y="292" font-size="13" font-weight="bold" fill="#0f172a">Factory 工厂</text>
  <text x="300" y="308" font-size="11" fill="#0f172a">封装复杂对象/聚合的创建</text>

  <rect x="528" y="270" width="232" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="544" y="292" font-size="13" font-weight="bold" fill="#0f172a">Domain Service</text>
  <text x="544" y="308" font-size="11" fill="#0f172a">不属于实体/VO 的领域过程</text>

  <rect x="40" y="330" width="232" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="56" y="352" font-size="13" font-weight="bold" fill="#0f172a">Domain Event 领域事件</text>
  <text x="56" y="368" font-size="11" fill="#0f172a">领域专家关心的事发生了（2004 后新增）</text>

  <rect x="284" y="330" width="232" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="300" y="352" font-size="13" font-weight="bold" fill="#0f172a">Module 模块</text>
  <text x="300" y="368" font-size="11" fill="#0f172a">讲述系统故事的聚合概念</text>

  <rect x="528" y="330" width="232" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="544" y="352" font-size="13" font-weight="bold" fill="#0f172a">Layered Architecture</text>
  <text x="544" y="368" font-size="11" fill="#0f172a">隔离领域模型，去除外部依赖</text>

  <line x1="20" y1="410" x2="780" y2="410" stroke="#e2e8f0" stroke-width="1"/>
  <text x="20" y="436" font-size="12" fill="#64748b"><tspan font-weight="bold">关键：</tspan>战略设计回答「边界在哪、谁和谁协作」，是 DDD 的根本；战术设计回答「模型怎么实现」，是细节。现代共识（Vernon / Khononov）——<tspan font-style="italic">战略优先，战术只是实现手段</tspan>。</text>
</svg>
