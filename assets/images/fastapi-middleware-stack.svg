<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="760" height="620" fill="#f8fafc" rx="8"/>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#0f172a">FastAPI 中间件栈：请求自顶向下穿过，响应自底向上返回</text>

  <!-- request arrow (left) -->
  <path d="M60,52 L60,575" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="26" y="52" font-size="11" fill="#64748b" transform="rotate(-90 26 52)">请求</text>
  <!-- response arrow (right) -->
  <path d="M700,575 L700,52" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="742" y="575" font-size="11" fill="#64748b" transform="rotate(-90 742 575)">响应</text>

  <!-- Layer 1: ServerErrorMiddleware (outermost) -->
  <rect x="120" y="58" width="540" height="78" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="136" y="84" font-size="14" font-weight="bold" fill="#7f1d1d">ServerErrorMiddleware</text>
  <text x="350" y="84" font-size="12" fill="#b91c1c">最外层 · 兜底未处理异常</text>
  <text x="136" y="108" font-size="12" fill="#0f172a">handler = 注册给 500 / Exception 的处理函数；未注册则返回裸 <tspan font-family="ui-monospace, Menlo, monospace">Internal Server Error</tspan> 500</text>
  <text x="136" y="126" font-size="11" fill="#64748b">debug=True 时返回带栈帧源码的 HTML 调试页</text>

  <!-- Layer 2: ExceptionTelemetryMiddleware -->
  <rect x="120" y="144" width="540" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="136" y="168" font-size="14" font-weight="bold" fill="#0f172a">ExceptionTelemetryMiddleware</text>
  <text x="418" y="168" font-size="12" fill="#64748b">异常遥测（0.162）</text>
  <text x="136" y="190" font-size="12" fill="#64748b">为进入 ExceptionMiddleware 的异常挂 OpenTelemetry 记录</text>

  <!-- Layer 3: user middleware -->
  <rect x="120" y="210" width="540" height="78" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="136" y="236" font-size="14" font-weight="bold" fill="#3730a3">用户中间件（user_middleware）</text>
  <text x="376" y="236" font-size="12" fill="#4f46e5">@app.middleware("http") / add_middleware</text>
  <text x="136" y="260" font-size="12" fill="#0f172a"><tspan font-weight="bold">后注册者更靠外</tspan>：<tspan font-family="ui-monospace, Menlo, monospace">add_middleware</tspan> 用 <tspan font-family="ui-monospace, Menlo, monospace">insert(0)</tspan> 插到队首</text>
  <text x="136" y="278" font-size="11" fill="#64748b">典型：CORS / GZip / 认证 / 请求日志计时（BaseHTTPMiddleware）</text>

  <!-- Layer 4: ExceptionMiddleware -->
  <rect x="120" y="296" width="540" height="78" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4"/>
  <text x="136" y="322" font-size="14" font-weight="bold" fill="#713f12">ExceptionMiddleware</text>
  <text x="338" y="322" font-size="12" fill="#a16207">把已注册异常处理函数派发成响应</text>
  <text x="136" y="346" font-size="12" fill="#0f172a">默认：HTTPException / WebSocketException；FastAPI 另注册 RequestValidationError(422)</text>
  <text x="136" y="364" font-size="11" fill="#64748b">按异常 <tspan font-family="ui-monospace, Menlo, monospace">__mro__</tspan> 就近匹配；HTTPException 先查「状态码处理器」</text>

  <!-- Layer 5: AsyncExitStackMiddleware -->
  <rect x="120" y="382" width="540" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="136" y="406" font-size="14" font-weight="bold" fill="#166534">AsyncExitStackMiddleware</text>
  <text x="402" y="406" font-size="12" fill="#16a34a">FastAPI 特有</text>
  <text x="136" y="428" font-size="12" fill="#64748b">管理关闭文件等资源的 AsyncExitStack；置于用户中间件内侧以保持 contextvars 上下文</text>

  <!-- Layer 6: APIRouter (innermost) -->
  <rect x="120" y="448" width="540" height="78" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.4"/>
  <text x="136" y="474" font-size="14" font-weight="bold" fill="#0f172a">APIRouter（最内层）</text>
  <text x="330" y="474" font-size="12" fill="#64748b">self.router</text>
  <text x="136" y="498" font-size="12" fill="#0f172a">路由匹配（FULL/PARTIAL）→ 依赖解析 <tspan font-family="ui-monospace, Menlo, monospace">solve_dependencies</tspan> → 端点执行</text>
  <text x="136" y="516" font-size="11" fill="#64748b">未匹配：404（not_found）或斜杠重定向（redirect_slashes）</text>

  <!-- build order note -->
  <text x="20" y="560" font-size="12" fill="#0f172a"><tspan font-weight="bold">构建顺序：</tspan><tspan font-family="ui-monospace, Menlo, monospace">build_middleware_stack</tspan> 先拼出上表列表，再 <tspan font-family="ui-monospace, Menlo, monospace">for cls in reversed(middleware)</tspan> 逐层包裹 <tspan font-family="ui-monospace, Menlo, monospace">self.router</tspan> —— 列表第一个元素最终在最外层。</text>
  <text x="20" y="586" font-size="12" fill="#0f172a"><tspan font-weight="bold">两种中间件：</tspan>① 纯 ASGI（<tspan font-family="ui-monospace, Menlo, monospace">def mw(app) -&gt; app</tspan>，如 CORS/GZip）；② <tspan font-family="ui-monospace, Menlo, monospace">BaseHTTPMiddleware</tspan>（给 <tspan font-family="ui-monospace, Menlo, monospace">dispatch(request, call_next)</tspan> 加钩子，见 §2 注意点）。</text>
</svg>
