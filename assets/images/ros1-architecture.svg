<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrgray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="#f8fafc" rx="8"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#0f172a">ROS 1 架构：Master 中心化 + 点对点 TCPROS</text>

  <!-- ROS Master -->
  <rect x="300" y="52" width="200" height="102" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="330" y="78" font-size="15" font-weight="bold" fill="#0f172a">ROS Master</text>
  <text x="330" y="98" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#dc2626">roscore（必须最先启动）</text>
  <text x="330" y="118" font-size="11" fill="#0f172a">节点 / 话题 / 服务注册表</text>
  <text x="330" y="138" font-size="11" fill="#0f172a">参数服务器</text>

  <!-- 节点 A：发布者 -->
  <rect x="40" y="230" width="220" height="110" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="56" y="256" font-size="14" font-weight="bold" fill="#0f172a">节点 A：相机驱动</text>
  <text x="56" y="278" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#4f46e5">Publisher</text>
  <text x="56" y="298" font-size="11" fill="#0f172a">话题 /camera/image</text>
  <text x="56" y="318" font-size="11" fill="#64748b">持续发布图像帧</text>

  <!-- 节点 B：订阅 + 发布 -->
  <rect x="290" y="230" width="220" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="306" y="256" font-size="14" font-weight="bold" fill="#0f172a">节点 B：图像处理</text>
  <text x="306" y="278" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">Subscriber + Publisher</text>
  <text x="306" y="298" font-size="11" fill="#0f172a">订阅 /camera/image</text>
  <text x="306" y="318" font-size="11" fill="#0f172a">发布 /features</text>

  <!-- 节点 C：订阅者 -->
  <rect x="540" y="230" width="220" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="556" y="256" font-size="14" font-weight="bold" fill="#0f172a">节点 C：规划器</text>
  <text x="556" y="278" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#166534">Subscriber</text>
  <text x="556" y="298" font-size="11" fill="#0f172a">订阅 /features</text>
  <text x="556" y="318" font-size="11" fill="#64748b">消费特征并规划</text>

  <!-- 注册/查询：节点 -> Master（虚线） -->
  <line x1="150" y1="230" x2="340" y2="154" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrgray)"/>
  <line x1="400" y1="230" x2="400" y2="154" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrgray)"/>
  <line x1="650" y1="230" x2="460" y2="154" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrgray)"/>
  <text x="150" y="196" font-size="11" font-weight="bold" fill="#64748b">① 注册 / 查询（XML-RPC）</text>

  <!-- 点对点数据：A -> B, B -> C（实线） -->
  <line x1="260" y1="285" x2="286" y2="285" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="510" y1="285" x2="536" y2="285" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr)"/>
  <text x="262" y="274" font-size="11" font-weight="bold" fill="#4f46e5">② TCPROS</text>
  <text x="512" y="274" font-size="11" font-weight="bold" fill="#4f46e5">② TCPROS</text>

  <!-- 底部注解 -->
  <line x1="20" y1="382" x2="780" y2="382" stroke="#e2e8f0" stroke-width="1"/>
  <text x="20" y="408" font-size="12" fill="#0f172a"><tspan font-weight="bold">通信流程：</tspan>节点启动 → 向 Master 注册自身与话题 → 订阅方查询 Master 获取发布方地址 → 双方直接建立 <tspan font-family="ui-monospace, Menlo, monospace">TCPROS/UDPROS</tspan> 点对点连接，数据不经 Master。</text>
  <text x="20" y="432" font-size="12" fill="#dc2626"><tspan font-weight="bold">单点故障：</tspan>Master 宕机后已建立的 P2P 连接仍可用，但新节点无法注册/发现；启动顺序敏感，必须最先 <tspan font-family="ui-monospace, Menlo, monospace">roscore</tspan>。</text>
  <text x="20" y="458" font-size="12" fill="#64748b"><tspan font-weight="bold">协议：</tspan>自定义 XML-RPC（控制面）+ TCPROS/UDPROS（数据面），非标准中间件，无 QoS、无实时、无安全。</text>
</svg>
