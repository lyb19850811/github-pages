<svg xmlns="http://www.w3.org/2000/svg" width="850" height="512" viewBox="0 0 850 512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="fwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="850" height="512" fill="#f8fafc" rx="8"/>
  <text x="20" y="26" font-size="17" font-weight="bold" fill="#0f172a">FastAPI 请求生命周期：ASGI → 路由 → 依赖解析 → 端点 → 序列化</text>

  <!-- 图例 -->
  <rect x="560" y="12" width="12" height="12" rx="2" fill="#4f46e5"/>
  <text x="578" y="22" font-size="11" fill="#64748b">前向请求</text>
  <rect x="648" y="12" width="12" height="12" rx="2" fill="#16a34a"/>
  <text x="666" y="22" font-size="11" fill="#64748b">返回 / 响应</text>

  <!-- 参与者表头 -->
  <!-- 1 客户端 -->
  <rect x="10" y="40" width="100" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">客户端</text>

  <!-- 2 Uvicorn -->
  <rect x="130" y="40" width="100" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="180" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Uvicorn</text>
  <text x="180" y="73" text-anchor="middle" font-size="10" fill="#64748b">ASGI 服务器</text>

  <!-- 3 Router -->
  <rect x="250" y="40" width="100" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="300" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Router</text>
  <text x="300" y="73" text-anchor="middle" font-size="10" fill="#64748b">Starlette</text>

  <!-- 4 APIRoute -->
  <rect x="370" y="40" width="100" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="420" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">APIRoute</text>
  <text x="420" y="73" text-anchor="middle" font-size="10" fill="#4f46e5">FastAPI</text>

  <!-- 5 依赖注入 -->
  <rect x="490" y="40" width="100" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="540" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">依赖注入</text>

  <!-- 6 端点函数 -->
  <rect x="610" y="40" width="100" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="660" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">端点函数</text>

  <!-- 7 Pydantic -->
  <rect x="730" y="40" width="100" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="780" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Pydantic</text>

  <!-- 生命线 -->
  <line x1="60"  y1="80" x2="60"  y2="478" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="180" y1="80" x2="180" y2="478" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="300" y1="80" x2="300" y2="478" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="420" y1="80" x2="420" y2="478" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="540" y1="80" x2="540" y2="478" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="660" y1="80" x2="660" y2="478" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="780" y1="80" x2="780" y2="478" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- 1. 客户端 -> Uvicorn -->
  <line x1="60" y1="96" x2="180" y2="96" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#fwd)"/>
  <text x="120" y="89" text-anchor="middle" font-size="11" fill="#4f46e5">HTTP 请求</text>

  <!-- 2. Uvicorn -> Router -->
  <line x1="180" y1="128" x2="300" y2="128" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#fwd)"/>
  <text x="240" y="121" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#4f46e5">ASGI scope/receive/send</text>

  <!-- 3. Router -> APIRoute -->
  <line x1="300" y1="160" x2="420" y2="160" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#fwd)"/>
  <text x="360" y="153" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#4f46e5">matches() 命中</text>

  <!-- 4. APIRoute -> 依赖注入 -->
  <line x1="420" y1="192" x2="540" y2="192" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#fwd)"/>
  <text x="480" y="185" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#4f46e5">solve_dependencies()</text>

  <!-- 5. 依赖注入 -> APIRoute -->
  <line x1="540" y1="224" x2="420" y2="224" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ret)"/>
  <text x="480" y="217" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#16a34a">values dict</text>

  <!-- 6. APIRoute -> 端点函数 -->
  <line x1="420" y1="256" x2="660" y2="256" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#fwd)"/>
  <text x="475" y="249" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#4f46e5">run_endpoint_function</text>

  <!-- 7. 执行分支说明（挂在端点函数上） -->
  <line x1="660" y1="256" x2="660" y2="282" stroke="#d97706" stroke-width="1.2"/>
  <rect x="670" y="282" width="172" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="680" y="300" font-size="11" fill="#92400e">async def → 事件循环 await</text>
  <text x="680" y="316" font-size="11" fill="#92400e">def → run_in_threadpool</text>

  <!-- 8. 端点函数 -> APIRoute -->
  <line x1="660" y1="344" x2="420" y2="344" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ret)"/>
  <text x="600" y="337" text-anchor="middle" font-size="11" fill="#16a34a">返回值</text>

  <!-- 9. APIRoute -> Pydantic -->
  <line x1="420" y1="376" x2="780" y2="376" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#fwd)"/>
  <text x="480" y="369" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#4f46e5">serialize_response</text>

  <!-- 10. Pydantic -> APIRoute -->
  <line x1="780" y1="408" x2="420" y2="408" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ret)"/>
  <text x="720" y="401" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#16a34a">JSON bytes</text>

  <!-- 11. APIRoute -> Uvicorn -->
  <line x1="420" y1="440" x2="180" y2="440" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ret)"/>
  <text x="240" y="433" text-anchor="middle" font-size="11" fill="#16a34a">Response</text>

  <!-- 12. Uvicorn -> 客户端 -->
  <line x1="180" y1="472" x2="60" y2="472" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ret)"/>
  <text x="120" y="465" text-anchor="middle" font-size="11" fill="#16a34a">HTTP 响应</text>

  <!-- 脚注 -->
  <text x="20" y="502" font-size="12" fill="#0f172a"><tspan font-weight="bold">三层职责：</tspan>Router/ASGI 属 Starlette · <tspan fill="#4f46e5" font-weight="bold">依赖解析</tspan>属 FastAPI · 校验/序列化属 Pydantic；端点分叉：<tspan fill="#d97706" font-weight="bold">async 跑事件循环，def 进线程池</tspan>。</text>
</svg>
