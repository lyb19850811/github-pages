<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
  <rect width="800" height="480" fill="#f8fafc" rx="8"/>
  <text x="20" y="32" font-size="17" font-weight="bold" fill="#0f172a">聚合：一致性边界——边界内同步一致，跨边界最终一致</text>

  <!-- 聚合 A：订单 -->
  <rect x="40" y="60" width="330" height="280" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="56" y="86" font-size="13" font-weight="bold" fill="#4f46e5">聚合 A：Order（订单）</text>

  <rect x="56" y="98" width="180" height="56" rx="6" fill="#c7d2fe" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="68" y="120" font-size="13" font-weight="bold" fill="#0f172a">Order（聚合根）</text>
  <text x="68" y="140" font-size="11" fill="#312e81">外部只能持根引用</text>

  <rect x="256" y="98" width="98" height="56" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1"/>
  <text x="266" y="120" font-size="12" font-weight="bold" fill="#0f172a">OrderLine</text>
  <text x="266" y="140" font-size="10" fill="#64748b">实体（行项）</text>

  <rect x="56" y="168" width="98" height="48" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1"/>
  <text x="66" y="188" font-size="12" font-weight="bold" fill="#0f172a">Money</text>
  <text x="66" y="204" font-size="10" fill="#64748b">值对象</text>

  <rect x="164" y="168" width="98" height="48" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1"/>
  <text x="174" y="188" font-size="12" font-weight="bold" fill="#0f172a">Address</text>
  <text x="174" y="204" font-size="10" fill="#64748b">值对象</text>

  <rect x="56" y="232" width="298" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="68" y="252" font-size="11" font-weight="bold" fill="#0f172a">不变量（由根强制）</text>
  <text x="68" y="270" font-size="10.5" fill="#64748b">如：订单总金额 = Σ 各行项金额；</text>
  <text x="68" y="284" font-size="10.5" fill="#64748b">已提交订单不可改行项</text>

  <text x="56" y="318" font-size="11" fill="#312e81">事务 = 一个聚合的完整加载/保存</text>

  <!-- 聚合 B/C -->
  <rect x="460" y="60" width="300" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="476" y="86" font-size="13" font-weight="bold" fill="#16a34a">聚合 B：Customer</text>
  <rect x="476" y="98" width="140" height="56" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
  <text x="488" y="120" font-size="12" font-weight="bold" fill="#0f172a">Customer（根）</text>
  <text x="488" y="138" font-size="10" fill="#14532d">信用等级 · 状态</text>

  <rect x="460" y="220" width="300" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="476" y="246" font-size="13" font-weight="bold" fill="#d97706">聚合 C：Product</text>
  <rect x="476" y="258" width="140" height="56" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.4"/>
  <text x="488" y="280" font-size="12" font-weight="bold" fill="#0f172a">Product（根）</text>
  <text x="488" y="298" font-size="10" fill="#78350f">价格 · 库存</text>

  <!-- 跨聚合箭头 -->
  <line x1="370" y1="130" x2="458" y2="130" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="370" y1="270" x2="458" y2="270" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <line x1="20" y1="368" x2="780" y2="368" stroke="#e2e8f0" stroke-width="1"/>
  <text x="20" y="394" font-size="12" fill="#64748b"><tspan font-weight="bold">两条硬规则：</tspan>① 事务不得跨越聚合边界——一个事务只改一个聚合，保证内部不变量；② 跨聚合一致性走异步（领域事件 / 最终一致），不能靠一个分布式事务强拉。</text>
  <text x="20" y="416" font-size="12" fill="#64748b">聚合设计错，往往是「边界画错」而非「代码写错」——这时应回到领域场景重新审视模型。</text>
</svg>
