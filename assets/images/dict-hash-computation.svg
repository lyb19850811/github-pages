<svg xmlns="http://www.w3.org/2000/svg" width="660" height="350" viewBox="0 0 660 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="660" height="350" fill="#f8fafc" rx="8"/>

  <text x="20" y="28" font-size="17" font-weight="bold" fill="#0f172a">哈希值 → 槽位：hash(key) &amp; mask</text>

  <rect x="20" y="42" width="620" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="36" y="64" font-size="13" fill="#0f172a">规则：hash(key) 返回一个 64 位整数；表大小 8 = 2³，所以<b>槽位 = hash &amp; 7</b>（只取二进制低 3 位）。</text>
  <text x="36" y="84" font-size="12" fill="#64748b">mask = 表大小 - 1 = 7 = 0b111；&amp; 运算等价于「对表大小取模」，但比 % 快。</text>

  <text x="60" y="122" text-anchor="middle" font-size="13" fill="#64748b">key</text>
  <text x="205" y="122" text-anchor="middle" font-size="13" fill="#64748b">__hash__()</text>
  <text x="395" y="122" text-anchor="middle" font-size="13" fill="#64748b">hash &amp; 7（低 3 位）</text>
  <text x="555" y="122" text-anchor="middle" font-size="13" fill="#64748b">槽位</text>

  <!-- lane 1: key 0 -->
  <rect x="20" y="136" width="80" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="60" y="158" text-anchor="middle" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">key = 0</text>
  <line x1="102" y1="153" x2="140" y2="153" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="146" y="136" width="118" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="205" y="158" text-anchor="middle" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">hash = 0</text>
  <line x1="266" y1="153" x2="302" y2="153" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="308" y="136" width="174" height="34" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="395" y="158" text-anchor="middle" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">0 &amp; 7 = 0</text>
  <line x1="484" y1="153" x2="506" y2="153" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="512" y="136" width="86" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="555" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">槽 0</text>

  <!-- lane 2: key 8 (collision) -->
  <rect x="20" y="186" width="80" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="60" y="208" text-anchor="middle" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">key = 8</text>
  <line x1="102" y1="203" x2="140" y2="203" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="146" y="186" width="118" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="205" y="208" text-anchor="middle" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">hash = 8</text>
  <line x1="266" y1="203" x2="302" y2="203" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="308" y="186" width="174" height="34" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="395" y="208" text-anchor="middle" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">8 &amp; 7 = 0</text>
  <line x1="484" y1="203" x2="506" y2="203" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="512" y="186" width="86" height="34" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="555" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">槽 0 ⚠</text>

  <!-- lane 3: key 1 -->
  <rect x="20" y="236" width="80" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="60" y="258" text-anchor="middle" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">key = 1</text>
  <line x1="102" y1="253" x2="140" y2="253" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="146" y="236" width="118" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="205" y="258" text-anchor="middle" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">hash = 1</text>
  <line x1="266" y1="253" x2="302" y2="253" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="308" y="236" width="174" height="34" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="395" y="258" text-anchor="middle" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">1 &amp; 7 = 1</text>
  <line x1="484" y1="253" x2="506" y2="253" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="512" y="236" width="86" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="555" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">槽 1</text>

  <text x="20" y="300" font-size="12" fill="#64748b">⚠ key = 8 和 key = 0 都算出「槽 0」——这就是<b>哈希冲突</b>，要触发「探测」找下一个空槽（下文 §5.3 与 §6.3）。</text>
  <text x="20" y="322" font-size="12" fill="#64748b">int 的 hash 就是它自己（hash(8)==8）；str/bytes 用 SipHash + 每进程随机种子（防碰撞攻击），同一字符串每次启动哈希值都不同。</text>
</svg>
