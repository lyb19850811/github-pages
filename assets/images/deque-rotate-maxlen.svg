<svg xmlns="http://www.w3.org/2000/svg" width="660" height="380" viewBox="0 0 660 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect width="660" height="380" fill="#f8fafc" rx="8"/>
  <text x="20" y="26" font-size="17" font-weight="bold" fill="#0f172a">rotate 与 maxlen：deque 的两个招牌操作</text>

  <!-- ===== Part A: rotate ===== -->
  <text x="20" y="56" font-size="13" font-weight="bold" fill="#0f172a">rotate(2) —— 把右边 2 个元素搬到左边</text>

  <!-- before strip A B C D E -->
  <rect x="20" y="70" width="46" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="43" y="94" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">A</text>
  <rect x="70" y="70" width="46" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="93" y="94" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">B</text>
  <rect x="120" y="70" width="46" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="143" y="94" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">C</text>
  <rect x="170" y="70" width="46" height="38" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="193" y="94" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#92400e">D</text>
  <rect x="220" y="70" width="46" height="38" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="243" y="94" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#92400e">E</text>
  <text x="283" y="94" font-size="14" fill="#64748b">← 右边 2 个</text>

  <line x1="160" y1="118" x2="160" y2="140" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- after strip D E A B C -->
  <rect x="20" y="146" width="46" height="38" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="43" y="170" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#92400e">D</text>
  <rect x="70" y="146" width="46" height="38" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="93" y="170" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#92400e">E</text>
  <rect x="120" y="146" width="46" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="143" y="170" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">A</text>
  <rect x="170" y="146" width="46" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="193" y="170" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">B</text>
  <rect x="220" y="146" width="46" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="243" y="170" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">C</text>

  <text x="20" y="206" font-size="12" fill="#64748b">rotate 按「块」批量搬指针（源码 _deque_rotate 用 memcpy 在块间移动），且 n 超过长度一半时自动反向转，故等效 O(min(n, len−n))。</text>

  <!-- ===== Part B: maxlen ===== -->
  <line x1="20" y1="220" x2="640" y2="220" stroke="#e2e8f0" stroke-width="1"/>
  <text x="20" y="244" font-size="13" font-weight="bold" fill="#0f172a">maxlen=3 —— 满了之后 append 从对面端丢（等价 Unix tail）</text>

  <!-- before [1 2 3] full -->
  <rect x="20" y="258" width="46" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="43" y="282" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">1</text>
  <rect x="70" y="258" width="46" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="93" y="282" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">2</text>
  <rect x="120" y="258" width="46" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="143" y="282" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">3</text>
  <text x="283" y="282" font-size="14" fill="#64748b">append(4)</text>

  <line x1="160" y1="306" x2="160" y2="328" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- after [2 3 4] -->
  <rect x="20" y="334" width="46" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="43" y="358" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">2</text>
  <rect x="70" y="334" width="46" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="93" y="358" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">3</text>
  <rect x="120" y="334" width="46" height="38" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="143" y="358" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#166534">4</text>
  <rect x="180" y="334" width="46" height="38" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/><text x="203" y="358" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#b91c1c">1</text>
  <text x="283" y="358" font-size="14" fill="#64748b">1 从左侧被挤出丢弃</text>

  <text x="20" y="372" font-size="12" fill="#64748b">源码 NEEDS_TRIM 宏：append 后若 maxlen 超限就调 popleft 丢弃最左元素；appendleft 超限则调 pop 丢最右。整个过程仍 O(1)。</text>
</svg>
