<svg xmlns="http://www.w3.org/2000/svg" width="800" height="530" viewBox="0 0 800 530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect width="800" height="530" fill="#f8fafc" rx="8"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#0f172a">ROS 2 分层：rmw 中间件抽象层隔离 DDS 细节</text>

  <!-- 1 用户代码 -->
  <rect x="40" y="48" width="720" height="68" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="56" y="74" font-size="14" font-weight="bold" fill="#0f172a">用户代码（你的节点逻辑）</text>
  <text x="56" y="96" font-size="11" fill="#64748b">只面向 ROS 数据结构编程，不感知任何 DDS / 中间件实现细节</text>

  <!-- 2 客户端库 -->
  <rect x="40" y="136" width="720" height="68" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="56" y="162" font-size="14" font-weight="bold" fill="#0f172a">ROS 客户端库</text>
  <text x="56" y="184" font-size="11" fill="#0f172a"><tspan font-family="ui-monospace, Menlo, monospace" fill="#4f46e5">rclcpp（C++）</tspan> / <tspan font-family="ui-monospace, Menlo, monospace" fill="#4f46e5">rclpy（Python）</tspan> —— 发布/订阅、服务、参数、action、executor</text>

  <!-- 3 rmw 接口 -->
  <rect x="40" y="224" width="720" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="56" y="250" font-size="14" font-weight="bold" fill="#0f172a">rmw 中间件接口（ROS Middleware Interface）</text>
  <text x="56" y="272" font-size="11" fill="#0f172a">纯 C 函数接口：<tspan font-family="ui-monospace, Menlo, monospace" fill="#92400e">create_node / create_publisher / publish</tspan> —— 屏蔽 DDS API 复杂度</text>

  <!-- 4 DDS 适配器 -->
  <rect x="40" y="312" width="720" height="68" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="56" y="338" font-size="14" font-weight="bold" fill="#0f172a">DDS 适配器（薄适配层）</text>
  <text x="56" y="360" font-size="11" fill="#0f172a"><tspan font-family="ui-monospace, Menlo, monospace" fill="#166534">rmw_fastrtps_cpp / rmw_cyclonedds_cpp / rmw_connextdds</tspan> —— 映射通用接口到具体实现 API + type support</text>

  <!-- 5 DDS 实现 -->
  <rect x="40" y="400" width="720" height="68" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="56" y="426" font-size="14" font-weight="bold" fill="#0f172a">DDS 实现</text>
  <text x="56" y="448" font-size="11" fill="#0f172a">eProsima Fast DDS / Eclipse Cyclone DDS / RTI Connext DDS —— 串行化 · 发现 · 传输 · QoS · 安全（DDS-Security）</text>

  <!-- 层间箭头 -->
  <line x1="400" y1="116" x2="400" y2="132" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="400" y1="204" x2="400" y2="220" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="400" y1="292" x2="400" y2="308" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="400" y1="380" x2="400" y2="396" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- 底部注解 -->
  <line x1="20" y1="486" x2="780" y2="486" stroke="#e2e8f0" stroke-width="1"/>
  <text x="20" y="512" font-size="12" fill="#64748b"><tspan font-weight="bold">切换：</tspan><tspan font-family="ui-monospace, Menlo, monospace">RMW_IMPLEMENTATION=rmw_cyclonedds_cpp</tspan> 运行时切换 DDS 实现；每个 .msg 包需为各 DDS 实现生成 type support（构建/分发包数量 × 供应商数）。</text>
</svg>
