<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="800" height="540" fill="#f8fafc" rx="8"/>
  <text x="20" y="32" font-size="17" font-weight="bold" fill="#0f172a">握手延迟对比：首字节应用数据前的往返次数</text>

  <!-- 面板 1：TCP+TLS 1.3 -->
  <text x="40" y="66" font-size="14" font-weight="bold" fill="#dc2626">TCP + TLS 1.3</text>
  <text x="40" y="86" font-size="13" font-weight="bold" fill="#b91c1c">2 RTT</text>
  <line x1="65" y1="100" x2="65" y2="470" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="245" y1="100" x2="245" y2="470" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="96" font-size="11" fill="#64748b">客户端</text>
  <text x="228" y="96" font-size="11" fill="#64748b">服务端</text>

  <line x1="65" y1="120" x2="245" y2="120" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="150" y="112" font-size="10" fill="#0f172a" text-anchor="middle">SYN</text>
  <line x1="245" y1="152" x2="65" y2="152" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="150" y="144" font-size="10" fill="#0f172a" text-anchor="middle">SYN + ACK</text>
  <line x1="65" y1="196" x2="245" y2="196" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="150" y="188" font-size="10" fill="#0f172a" text-anchor="middle">ACK + ClientHello</text>
  <line x1="245" y1="228" x2="65" y2="228" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="150" y="220" font-size="10" fill="#0f172a" text-anchor="middle">ServerHello + Finished</text>
  <line x1="65" y1="288" x2="245" y2="288" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="150" y="280" font-size="10" fill="#166534" text-anchor="middle">HTTP 请求（首数据）</text>
  <text x="150" y="312" font-size="10" fill="#b91c1c" text-anchor="middle">建连 + TLS 握手 = 2 次往返</text>

  <!-- 面板 2：QUIC 1-RTT -->
  <text x="295" y="66" font-size="14" font-weight="bold" fill="#16a34a">QUIC 1-RTT</text>
  <text x="295" y="86" font-size="13" font-weight="bold" fill="#166534">1 RTT</text>
  <line x1="320" y1="100" x2="320" y2="470" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="500" y1="100" x2="500" y2="470" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="307" y="96" font-size="11" fill="#64748b">客户端</text>
  <text x="483" y="96" font-size="11" fill="#64748b">服务端</text>

  <line x1="320" y1="120" x2="500" y2="120" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="410" y="112" font-size="10" fill="#0f172a" text-anchor="middle">Initial（含 ClientHello）</text>
  <line x1="500" y1="152" x2="320" y2="152" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="410" y="144" font-size="10" fill="#0f172a" text-anchor="middle">Handshake（ServerHello + Finished）</text>
  <line x1="320" y1="212" x2="500" y2="212" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="410" y="204" font-size="10" fill="#166534" text-anchor="middle">HTTP 请求（首数据）</text>
  <text x="410" y="236" font-size="10" fill="#166534" text-anchor="middle">加密 + 传输参数协商一次完成</text>

  <!-- 面板 3：QUIC 0-RTT -->
  <text x="550" y="66" font-size="14" font-weight="bold" fill="#16a34a">QUIC 0-RTT</text>
  <text x="550" y="86" font-size="13" font-weight="bold" fill="#166534">0 RTT（恢复连接）</text>
  <line x1="575" y1="100" x2="575" y2="470" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="755" y1="100" x2="755" y2="470" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="562" y="96" font-size="11" fill="#64748b">客户端</text>
  <text x="738" y="96" font-size="11" fill="#64748b">服务端</text>

  <line x1="575" y1="120" x2="755" y2="120" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="665" y="112" font-size="10" fill="#166534" text-anchor="middle">ClientHello + 0-RTT 应用数据</text>
  <line x1="755" y1="152" x2="575" y2="152" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="665" y="144" font-size="10" fill="#0f172a" text-anchor="middle">ServerHello + Finished</text>
  <line x1="575" y1="212" x2="755" y2="212" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="665" y="204" font-size="10" fill="#166534" text-anchor="middle">1-RTT 应用数据</text>
  <text x="665" y="236" font-size="10" fill="#166534" text-anchor="middle">用上次会话的密钥，首包即带数据</text>

  <!-- 底部注解 -->
  <line x1="20" y1="470" x2="780" y2="470" stroke="#e2e8f0" stroke-width="1"/>
  <text x="20" y="496" font-size="12" fill="#64748b"><tspan font-weight="bold">注意：</tspan>QUIC 与 TLS 握手合并，建连即协商加密与传输参数（流控上限、连接 ID 等），一次往返即可开始发送应用数据；0-RTT 属「恢复连接」场景（需此前会话的 PSK 密钥），且其数据可被攻击者重放。</text>
  <text x="20" y="518" font-size="12" fill="#64748b">对比基准：TLS 1.3 over TCP 仍需 1 次 TCP 握手 + 1 次 TLS 握手（共 2 RTT）；TCP Fast Open 可省去部分，但需内核/中间盒配合。</text>
</svg>
