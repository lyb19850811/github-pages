<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.summary | default: site.description | escape }}">
  <meta property="og:type" content="{% if page.layout == 'research' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:locale" content="zh_CN">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta name="twitter:description" content="{{ page.summary | default: site.description | escape }}">
  {% if page.layout == 'research' %}
  <meta property="article:published_time" content="{{ page.date | date: '%Y-%m-%d' }}">
  {% for t in page.tags %}<meta property="article:tag" content="{{ t }}">{% endfor %}
  {% endif %}
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  {% if page.math %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],throwOnError:false});"></script>
  {% endif %}
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
  <nav>
    <a href="{{ '/' | relative_url }}"{% if page.active == 'index' %} class="active"{% endif %}>首页</a>
    <a href="{{ '/notes/' | relative_url }}"{% if page.active == 'notes' %} class="active"{% endif %}>研究笔记</a>
    <a href="{{ '/news/' | relative_url }}"{% if page.active == 'news' %} class="active"{% endif %}>每日AI资讯</a>
    <a href="{{ '/games/' | relative_url }}"{% if page.active == 'games' %} class="active"{% endif %}>小游戏</a>
    <a href="{{ '/tags.html' | relative_url }}"{% if page.active == 'tags' %} class="active"{% endif %}>标签</a>
    <a href="{{ '/about.html' | relative_url }}"{% if page.active == 'about' %} class="active"{% endif %}>关于</a>
  </nav>
  <main>
    {{ content }}
  </main>
</body>
</html>
