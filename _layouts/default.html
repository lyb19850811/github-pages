<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  {% if page.math %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],throwOnError:false});"></script>
  {% endif %}
</head>
<body>
  <nav>
    <a href="{{ '/' | relative_url }}"{% if page.active == 'index' %} class="active"{% endif %}>首页</a>
    <a href="{{ '/tags.html' | relative_url }}"{% if page.active == 'tags' %} class="active"{% endif %}>标签</a>
    <a href="{{ '/about.html' | relative_url }}"{% if page.active == 'about' %} class="active"{% endif %}>关于</a>
  </nav>
  <main>
    {{ content }}
  </main>
</body>
</html>
