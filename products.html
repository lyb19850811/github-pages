<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品展示 - GitHub Pages 示例站点</title>
  <meta name="description" content="商品展示列表，包含耳机与数字艺术画两类产品，点击查看详情。">
  <link rel="canonical" href="https://lyb19850811.github.io/github-pages/products.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GitHub Pages 示例">
  <meta property="og:title" content="商品展示 - GitHub Pages 示例站点">
  <meta property="og:description" content="商品展示列表，包含耳机与数字艺术画两类产品。">
  <meta property="og:url" content="https://lyb19850811.github.io/github-pages/products.html">
  <meta property="og:locale" content="zh_CN">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="商品展示 - GitHub Pages 示例站点">
  <meta name="twitter:description" content="商品展示列表，包含耳机与数字艺术画两类产品。">
  <link rel="stylesheet" href="style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "商品展示",
    "url": "https://lyb19850811.github.io/github-pages/products.html"
  }
  </script>
</head>
<body>
  <nav>
    <a href="./">首页</a>
    <a href="products.html" class="active">商品</a>
    <a href="about.html">关于</a>
  </nav>
  <h1>商品展示</h1>
  <p class="meta">共 <span id="count">0</span> 件商品 · 纯静态展示，无需后端。</p>
  <div class="filter" id="filter">
    <button class="active" data-category="全部">全部</button>
    <button data-category="耳机">耳机</button>
    <button data-category="数字艺术">数字艺术</button>
  </div>
  <div class="grid" id="grid"></div>
  <script>
  (async function () {
    var grid = document.getElementById('grid');
    var countEl = document.getElementById('count');
    var buttons = document.querySelectorAll('#filter button');
    var products = [];
    try {
      var res = await fetch('products.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      products = (await res.json()).products;
    } catch (err) {
      grid.innerHTML = '<p class="error">商品数据加载失败，请稍后重试。</p>';
      return;
    }
    var current = '全部';
    countEl.textContent = products.length;
    function render() {
      var list = current === '全部' ? products : products.filter(function (p) { return p.category === current; });
      grid.innerHTML = list.map(function (p) {
        return '' +
          '<a class="card" href="product.html?id=' + encodeURIComponent(p.id) + '">' +
            '<img src="' + p.image + '" alt="' + p.alt + '" loading="lazy">' +
            '<div class="card-body">' +
              '<span class="tag">' + p.category + '</span>' +
              '<h2>' + p.name + '</h2>' +
              '<p class="price">¥' + p.price + '</p>' +
            '</div>' +
          '</a>';
      }).join('');
    }
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        current = btn.getAttribute('data-category');
        buttons.forEach(function (b) { b.classList.toggle('active', b === btn); });
        render();
      });
    });
    render();
  })();
  </script>
</body>
</html>
