title: 研究日志
description: 日常研究结果记录
lang: zh-CN
url: https://lyb19850811.github.io
baseurl: /github-pages

markdown: kramdown
permalink: /research/:slug/
future: true
plugins:
  - jekyll-sitemap
  - jekyll-feed
collections:
  news:
    output: true
    permalink: /news/:name/
exclude:
  - README.md
  - scripts

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: research
      math: true
  - scope:
      path: ""
      type: "news"
    values:
      layout: news
